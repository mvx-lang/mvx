# Build MVX and run the test suite on every push and pull request.
name: ci

on:
  push:
    # DEVELOP TOO.  Work lands there and a release is gated on a green run for
    # the commit being tagged -- a branch CI never runs on cannot be released
    # from, and the nightly has nothing to decide with.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  LLVM_VERSION: "21"

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mvx
          POSTGRES_PASSWORD: mvx
          POSTGRES_DB: mvx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mvx"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true          # docs (the wiki) and demo

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ liblmdb-dev libedit-dev \
            libgit2-dev libpq-dev postgresql-client libmongoc-dev pkg-config \
            libmariadb-dev \
            zlib1g-dev libzstd-dev libncurses-dev \
            wget lsb-release software-properties-common gnupg ca-certificates
          # apt.llvm.org, WITH RETRIES.  LLVM 21 is not in Debian or Ubuntu, so
          # this host is the only source and a release cannot avoid depending on
          # it — but it does not have to depend on it being up at one instant.
          # v0.1.3 failed here on llvm.sh's own key check
          # ("GPG key not reachable at .../llvm-snapshot.gpg.key") while both
          # binary jobs had installed the same way minutes earlier; it passed on
          # re-run (mvx#141).  Retry the fetch, the script AND the install
          # together: the script adds the repository, the install pulls from it,
          # and either can be the one that cannot reach the host.
          llvm_ok=
          for attempt in 1 2 3 4 5; do
            if wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh \
               && chmod +x /tmp/llvm.sh \
               && sudo /tmp/llvm.sh "${LLVM_VERSION}" \
               && sudo apt-get install -y --no-install-recommends \
                    "llvm-${LLVM_VERSION}-dev"; then
              llvm_ok=1; break
            fi
            echo "apt.llvm.org attempt ${attempt} failed; retrying in $((attempt * 15))s"
            sleep $((attempt * 15))
          done
          if [ -z "$llvm_ok" ]; then
            echo "::error::apt.llvm.org unreachable after 5 attempts over ~4 minutes."
            echo "::error::Nothing is wrong with the code; re-run when the host is back."
            exit 1
          fi

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/usr/lib/llvm-${LLVM_VERSION}"
          cmake --build build

      - name: Test
        env:
          MVX_PG: "address=localhost:5432 dbname=mvx user=mvx password=mvx"
          MVX_MONGO: "address=localhost:27017 namespace=mvxtest"
          MVX_SIEVE_OPTIONAL: "1"   # perf benchmark: report, don't gate CI
          # The install lists package releases through the GitHub API (mvx#212),
          # which is rate-limited per IP; runners share IPs.
          GITHUB_TOKEN: ${{ github.token }}
        run: ./scripts/test.sh

  # ---- the glibc floor, guarded on every change (mvx#203) -------------------
  # The published Linux binaries are built in a glibc 2.28 container so they
  # run on RHEL/Rocky 8 and everything newer.  Nothing about that is visible
  # from a normal build -- the floor is set by whatever libc links the
  # binaries, so it rises the moment the release image does, silently, and
  # stays invisible until somebody downloads a release onto an older host.
  #
  # So build the same way here and ASSERT the floor.  This is a compile and a
  # link only: the suite runs in build-test above, on a current image, because
  # what is being checked is the floor rather than the behaviour.
  glibc-floor:
    name: builds against glibc 2.28
    runs-on: ubuntu-24.04
    container: quay.io/pypa/manylinux_2_28_x86_64
    timeout-minutes: 60
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true

      - name: Install toolchain
        run: |
          dnf -y install epel-release
          dnf -y install \
            cmake ninja-build gcc-toolset-14 \
            "llvm-devel-${LLVM_VERSION}*" \
            lmdb-devel libedit-devel libgit2-devel libpq-devel pkgconfig \
            zlib-devel libzstd-devel ncurses-devel git tar gzip
          ldd --version | head -1
          llvm-config --version

      - name: Build and install
        run: |
          . /opt/rh/gcc-toolset-14/enable
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix "$PWD/stage/mvx-lang"

      - name: Assert the glibc floor
        run: |
          max=$(objdump -T stage/mvx-lang/bin/* stage/mvx-lang/lib/*.so 2>/dev/null \
                | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n | tail -1)
          echo "highest required: ${max:-none}"
          case "${max:-GLIBC_2.0}" in
            GLIBC_2.[0-9]|GLIBC_2.1[0-9]|GLIBC_2.2[0-8]) ;;
            *) echo "::error::floor rose to $max; mvx#203 pins it at GLIBC_2.28"
               exit 1 ;;
          esac
