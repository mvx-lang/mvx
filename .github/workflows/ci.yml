# Build MVX and run the test suite on every push and pull request.
name: ci

on:
  push:
    # DEVELOP TOO.  Work lands there and a release is gated on a green run for
    # the commit being tagged -- a branch CI never runs on cannot be released
    # from, and the nightly has nothing to decide with.
    branches: [main, develop]
  pull_request:
  workflow_dispatch:

env:
  LLVM_VERSION: "21"

jobs:
  build-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_USER: mvx
          POSTGRES_PASSWORD: mvx
          POSTGRES_DB: mvx
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U mvx"
          --health-interval 5s --health-timeout 5s --health-retries 10
      mongo:
        image: mongo:7
        ports:
          - 27017:27017
        options: >-
          --health-cmd "mongosh --quiet --eval 'db.adminCommand({ping:1})'"
          --health-interval 5s --health-timeout 5s --health-retries 10
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true          # packages/git is the mv_git record-git engine

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ liblmdb-dev libedit-dev \
            libgit2-dev libpq-dev postgresql-client libmongoc-dev pkg-config \
            zlib1g-dev libzstd-dev libncurses-dev \
            wget lsb-release software-properties-common gnupg ca-certificates
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y --no-install-recommends "llvm-${LLVM_VERSION}-dev"

      - name: Build
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/usr/lib/llvm-${LLVM_VERSION}"
          cmake --build build

      - name: Test
        env:
          MVX_PG: "address=localhost:5432 dbname=mvx user=mvx password=mvx"
          MVX_MONGO: "address=localhost:27017 namespace=mvxtest"
          MVX_SIEVE_OPTIONAL: "1"   # perf benchmark: report, don't gate CI
        run: ./scripts/test.sh
