# Release pipeline: on a v* tag, build Linux binaries for amd64 and arm64
# and publish the three container images to the GitHub Container Registry
# (ghcr.io/mvx-lang/...).  No external secrets — the built-in GITHUB_TOKEN
# authenticates to ghcr.io.
name: release

on:
  push:
    # ONE rolling dev tag, moved to develop's HEAD by the nightly when there is
    # something new and CI is green.  It builds through THIS workflow rather
    # than a second copy of it, so a dev build is the same artifacts by the same
    # steps as a release -- the only way a dev build is worth having.
    tags: ["v*", "dev"]
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write        # create the GitHub release and upload assets
  packages: write        # push images to ghcr.io

env:
  LLVM_VERSION: "21"

jobs:
  # ---- nothing is published from a commit CI has not passed on -----------
  # A release is a promise that this build works.  Without this the promise is
  # that it compiled on the machine that tagged it.
  ci-gate:
    name: CI must be green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Require a green ci run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          now() { date +%s; }
          api="repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100"
          appear_by=$(( $(now) + 600 ))    # 10 min for the run to show up
          finish_by=$(( $(now) + 3600 ))   # 60 min for it to finish

          while :; do
            run="$(gh api "$api" --jq '.workflow_runs | sort_by(.run_started_at) | last // empty')"

            if [ -z "$run" ]; then
              if [ "$(now)" -ge "$appear_by" ]; then
                echo "::error::no ci run for $SHA. Release only a commit CI has run on: push it, let ci finish, then tag it."
                exit 1
              fi
              echo "no ci run for $SHA yet, waiting ..."; sleep 20; continue
            fi

            id="$(printf '%s' "$run" | jq -r .id)"
            url="$(printf '%s' "$run" | jq -r .html_url)"
            status="$(printf '%s' "$run" | jq -r .status)"

            if [ "$status" != completed ]; then
              if [ "$(now)" -ge "$finish_by" ]; then
                echo "::error::ci run $url is still '$status' after 60 minutes. Not releasing on an unfinished run."
                exit 1
              fi
              echo "ci run is '$status' ($url), waiting ..."; sleep 20; continue
            fi

            concl="$(printf '%s' "$run" | jq -r .conclusion)"
            if [ "$concl" != success ]; then
              echo "::error::ci concluded '$concl' for $SHA ($url). Nothing will be published."
              exit 1
            fi

            # A run whose job was renamed, removed or never scheduled still
            # concludes 'success' overall.  A job that did not run is not a job
            # that passed.
            jobs="$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                      --jq '[.jobs[] | select(.conclusion == "success") | .name]')"
            printf '%s' "$jobs" | jq -e 'index("build-test")' >/dev/null || {
              echo "::error::ci run $url has no successful 'build-test' job."
              exit 1
            }

            echo "ci is green for $SHA: $url"
            break
          done

  # ---- native Linux binaries, one job per architecture -------------------
  binaries:
    needs: ci-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          # PINNED, NOT `ubuntu-latest' (mvx#203).  The binaries link against
          # the runner's own libc, so that label decides the glibc floor of
          # every published tarball -- and it MOVES.  It is 24.04 today; when
          # GitHub points it at 26.04 the floor rises again, the release still
          # succeeds, and the set of machines able to run mvx quietly shrinks.
          # CI cannot catch it either: CI runs on the image that built it.
          #
          # BUILT IN A glibc 2.28 CONTAINER, not on the runner's own libc
          # (mvx#203).  The binaries link against whatever libc builds them, so
          # building on the runner made every published tarball require
          # GLIBC_2.38 -- which excluded Debian 12, RHEL/Rocky 8 and 9, and
          # Ubuntu 22.04, including every MV platform VM this project tests
          # against.  manylinux_2_28 is AlmaLinux 8: glibc 2.28, the oldest
          # thing worth supporting, and it carries gcc-toolset-14 and
          # llvm-devel 21 in AppStream.  The runner label still only decides
          # the host architecture.
          - runner: ubuntu-24.04
            arch: amd64
            image: quay.io/pypa/manylinux_2_28_x86_64
          - runner: ubuntu-24.04-arm
            arch: arm64
            image: quay.io/pypa/manylinux_2_28_aarch64
    runs-on: ${{ matrix.runner }}
    container: ${{ matrix.image }}
    steps:
      - uses: actions/checkout@v5
        with:
          # docs (the wiki) and demo.  The released packages stopped being
          # submodules in #169 — the JSON codec that used to arrive that way is
          # built into libmvxrt now, so a shallow checkout no longer silently
          # produces a runtime with no JSONENCODE.
          submodules: true

      - name: Install toolchain
        run: |
          # AppStream carries llvm-devel 21, so apt.llvm.org is no longer in
          # the path of a release at all.  That host was a single point of
          # failure with a five-attempt retry loop around it, and it still took
          # v0.1.3 down on its own key check (mvx#141).
          dnf -y install epel-release
          dnf -y install \
            cmake ninja-build gcc-toolset-14 \
            "llvm-devel-${LLVM_VERSION}*" \
            lmdb-devel libedit-devel libgit2-devel libpq-devel pkgconfig \
            sqlite-devel \
            zlib-devel libzstd-devel ncurses-devel git tar gzip
          llvm-config --version

      - name: Build and install
        env:
          # The install asks GitHub which package versions exist (mvx#212);
          # with nobody at the terminal it takes each one's latest stable, so
          # a release bundles whatever is latest when it is built.  The token
          # keeps that listing clear of the per-IP rate limit.
          GITHUB_TOKEN: ${{ github.token }}
          MVX_INSTALL_PROMPT: never
        run: |
          # gcc-toolset-14 is not on PATH until its enable script is sourced;
          # EL8's stock gcc is 8.5 and does not do C++17 well enough.
          . /opt/rh/gcc-toolset-14/enable
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release
          cmake --build build
          cmake --install build --prefix "$PWD/stage/mvx-lang"

      # SHIP WHAT THE BUILD IMAGE HAPPENS TO CARRY (mvx#297).  v0.3.0 was built
      # on the Ubuntu runner and linked libedit.so.2; since mvx#203 the build
      # happens in manylinux_2_28 (AlmaLinux 8), whose libedit is soname 0.
      # So every v0.4.0 binary asks its host for libedit.so.0 -- a soname no
      # current distribution ships -- and mvx could not start anywhere except
      # inside the image that built it.  Static linking is not open to us: the
      # image has no libedit.a and EL8 packages none.
      #
      # RUNPATH IS NOT INHERITED, which is why each copy is patched.  bin/ is
      # built with RUNPATH $ORIGIN/../lib, so the loader finds our libedit --
      # but a RUNPATH applies only to the object that carries it, so libedit's
      # own libtinfo.so.6 would be looked for in the system paths and nowhere
      # else.  Give every copied library $ORIGIN and the closure holds.
      - name: Bundle the libraries the host may not have
        run: |
          set -eu
          LIB=stage/mvx-lang/lib

          # Every soname anything we ship asks for.  Per file, because a
          # non-ELF in the tree (mvx_crt.o's directory neighbours) must not
          # take the whole listing down -- and because the loop below adds
          # files to lib/ that this has to see on the next pass.
          needed() {
            for f in stage/mvx-lang/bin/* "$LIB"/*; do
              [ -f "$f" ] || continue
              objdump -p "$f" 2>/dev/null | awk '/NEEDED/ {print $2}'
            done | sort -u
          }

          # Present on every glibc system, so never bundled and never a reason
          # to rewrite a copied library.  Named once; the loop and the rpath
          # decision below both read it.
          universal() {
            case "$1" in
              libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|librt.so.1) return 0 ;;
              libgcc_s.so.1|libstdc++.so.6|ld-linux*) return 0 ;;
            esac
            return 1
          }

          for pass in 1 2 3 4 5; do
            added=
            for so in $(needed); do
              # Shipping our own copy of the universal set is what breaks a
              # program, not what saves it.
              universal "$so" && continue
              case "$so" in
                # dlopen'd backends, and the ONLY exception to the rule.
                # Nothing that has to start may need a library we do not ship;
                # a driver may, because a driver whose client library is absent
                # is skipped and mvx runs on without that backend.  libpq in
                # particular is coupled to somebody else's server version and
                # is the host's to choose.  (liblmdb is not in this list:
                # mvx-lmdbd links it and an executable does not degrade.)
                libpq.so.*|libsqlite3.so.*) continue ;;
                # Ours, installed above.
                libmvx*) continue ;;
              esac
              [ -e "$LIB/$so" ] && continue

              src=
              for d in /usr/lib64 /lib64 /usr/lib /lib; do
                [ -e "$d/$so" ] && { src="$d/$so"; break; }
              done
              [ -n "$src" ] || { echo "::error::$so is needed and is not in this image"; exit 1; }

              cp -L "$src" "$LIB/$so"
              chmod u+w "$LIB/$so"

              # Only a library with a dependency of its own needs an rpath, and
              # only then is it worth rewriting: patchelf pads the file to make
              # room, which took libz from 99 KB to 2.1 MB.  libedit is the one
              # that needs it (libtinfo.so.6); liblmdb, libz and libzstd need
              # nothing but libc and are copied untouched.
              for dep in $(objdump -p "$LIB/$so" 2>/dev/null | awk '/NEEDED/ {print $2}'); do
                universal "$dep" && continue
                patchelf --set-rpath '$ORIGIN' "$LIB/$so"
                echo "  gave $so an rpath of \$ORIGIN for $dep"
                break
              done

              echo "bundled $so from $src (pass $pass)"
              added=1
            done
            [ -n "$added" ] || break
          done

      # THE FLOOR IS AN ASSERTION, NOT A HOPE (mvx#203).  A release that
      # quietly needed a newer libc than it claims is exactly the failure this
      # issue is about, and it is invisible until somebody downloads it.
      # AND THE DRIVER SET (mvx#203).  A missing -devel package does not fail
      # the build: the driver is skipped with a message nobody reads, and the
      # release ships without a backend.  sqlite shipped at all only because
      # the Ubuntu runner image happened to carry libsqlite3-dev -- the
      # workflow never asked for it.  Name what must be there.
      - name: Assert the drivers that must ship
        run: |
          miss=
          for d in dir lmdb lmdbnet postgres sqlite; do
            [ -f "stage/mvx-lang/lib/libmvxdrv_$d.so" ] || miss="$miss $d"
          done
          ls stage/mvx-lang/lib/
          [ -z "$miss" ] || { echo "::error::drivers missing:$miss"; exit 1; }

      - name: Assert the glibc floor
        run: |
          max=$(objdump -T stage/mvx-lang/bin/* stage/mvx-lang/lib/*.so 2>/dev/null \
                | grep -oE 'GLIBC_2\.[0-9]+' | sort -t. -k2 -n | tail -1)
          echo "highest required: ${max:-none}"
          # An assertion that passes when its tool is missing asserts nothing:
          # no objdump, no versioned symbols, and the case below says fine.
          [ -n "$max" ] || { echo "::error::found no GLIBC_2.x at all -- objdump did not run"; exit 1; }
          case "$max" in
            GLIBC_2.[0-9]|GLIBC_2.1[0-9]|GLIBC_2.2[0-8]) ;;
            *) echo "::error::floor rose to $max; mvx#203 pins it at GLIBC_2.28"
               exit 1 ;;
          esac

      # THE SAME FAILURE, GENERALISED (mvx#297).  Bundling libedit fixes
      # today's break; this is what stops the next one.  Every library a
      # shipped binary needs must be on every glibc system or in our own
      # lib/ -- and the exceptions are named here rather than discovered by
      # whoever downloads the release.
      - name: Assert nothing needs a library we do not ship
        run: |
          set -eu
          # The same two lists as the bundling step, on purpose: if they ever
          # disagree this step is what says so.
          universal() {
            case "$1" in
              libc.so.6|libm.so.6|libdl.so.2|libpthread.so.0|librt.so.1) return 0 ;;
              libgcc_s.so.1|libstdc++.so.6|ld-linux*) return 0 ;;
            esac
            return 1
          }
          bad=
          for f in stage/mvx-lang/bin/* stage/mvx-lang/lib/*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            for so in $(objdump -p "$f" 2>/dev/null | awk '/NEEDED/ {print $2}'); do
              universal "$so" && continue
              case "$so" in
                libpq.so.*|libsqlite3.so.*)
                  echo "advisory, dlopen'd driver: $b needs $so"; continue ;;
              esac
              [ -e "stage/mvx-lang/lib/$so" ] && { echo "shipped: $b needs $so"; continue; }
              bad="$bad $b:$so"
            done
          done
          ls -l stage/mvx-lang/lib/
          [ -z "$bad" ] || { echo "::error::needed, not universal, not shipped:$bad"; exit 1; }

      - name: Smoke test the install
        run: |
          BIN="$PWD/stage/mvx-lang/bin"
          printf 'PRINT "install-ok ":2+2\n' > /tmp/smoke.b
          "$BIN/mvx-basic" /tmp/smoke.b -o /tmp/smoke
          out="$(/tmp/smoke)"
          echo "$out"
          test "$out" = "install-ok 4"

      - name: Bundle the wiki docs
        run: |
          # Ship the current documentation (the GitHub wiki) inside the tarball
          # so offline installs have the docs.  Cloned fresh at release time so
          # it is always the latest wiki, independent of the docs/ submodule pin.
          git clone --depth 1 https://github.com/mvx-lang/mvx.wiki.git wiki
          rm -rf wiki/.git
          install -d stage/mvx-lang/share/doc/mvx
          cp -R wiki/. stage/mvx-lang/share/doc/mvx/

      - name: Package tarball
        id: pkg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = workflow_dispatch ] && VER="${{ inputs.tag }}" && VER="${VER#v}"
          NAME="mvx-lang-${VER}-linux-${{ matrix.arch }}.tar.gz"
          tar -C stage -czf "$NAME" mvx-lang
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      # NOT ATTACHED TO THE RELEASE HERE (mvx#297).  Publishing from inside
      # the build container is what let v0.4.0 out: every check it passed ran
      # on the one machine where its libraries were guaranteed to exist.  The
      # tarball is handed to the verify job below instead, and that job --
      # running on the bare runner, which is not this image -- is the only
      # thing that publishes.
      - uses: actions/upload-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}
          path: ${{ steps.pkg.outputs.name }}
          if-no-files-found: error
          retention-days: 1

  # ---- run it somewhere that is not the image that built it ---------------
  # THE LAST CHECK THAT COUNTS (mvx#297).  Every assertion in the binaries job
  # is a claim about the tarball read off its own contents; this one starts the
  # program on a different machine, and it is the step that attaches the asset.
  # The runner is the same label that used to build these binaries before
  # mvx#203, so it is an ordinary glibc host, and -- the point -- it does not
  # carry libedit.so.0, which is asserted below rather than assumed.
  verify:
    needs: binaries
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-24.04
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: tarball-${{ matrix.arch }}

      - name: This host is not the build image
        run: |
          set -eu
          . /etc/os-release; echo "host: $PRETTY_NAME"; ldd --version | head -1
          # A green run here means nothing if the runner happens to carry the
          # library the release should not be asking for.  Say so out loud.
          for d in /usr/lib64 /lib64 /usr/lib /lib /usr/lib/x86_64-linux-gnu /usr/lib/aarch64-linux-gnu; do
            [ -e "$d/libedit.so.0" ] && { echo "::error::$d/libedit.so.0 exists here, so this test proves nothing"; exit 1; }
          done
          echo "no libedit.so.0 on this host -- the pre-#297 tarball would fail below"

      - name: Unpack and run the published tarball
        run: |
          set -eu
          tar -xzf mvx-lang-*.tar.gz
          B="$PWD/mvx-lang/bin"

          # Nothing may resolve outside the tarball except the universal set.
          # ldd answers "not found" for a missing soname without running the
          # program, so this reports every break at once rather than the first.
          # The postgres and sqlite drivers are dlopen'd and degrade when their
          # client library is absent, so they are reported and not fatal.
          bad=
          for f in "$B"/* "$PWD"/mvx-lang/lib/*.so*; do
            [ -f "$f" ] || continue
            b=$(basename "$f")
            for so in $(ldd "$f" 2>/dev/null | awk '/not found/ {print $1}'); do
              case "$b" in
                libmvxdrv_postgres.so|libmvxdrv_sqlite.so)
                  echo "dlopen'd driver, degrades here: $b needs $so" ;;
                *) echo "::error::$b needs $so and nothing provides it"
                   bad="$bad $b:$so" ;;
              esac
            done
          done
          [ -z "$bad" ] || { echo "::error::unresolved on a plain host:$bad"; exit 1; }

          # And then actually start them.  A NEEDED soname is resolved before
          # main(), so this is the whole of mvx#297 in one line.
          "$B/mvx" --version

          printf 'PRINT "published-ok ":2+2\n' > prog.b
          "$B/mvx-basic" prog.b -o prog
          out="$(./prog)"
          echo "$out"
          test "$out" = "published-ok 4"

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: mvx-lang-*.tar.gz
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true

  # ---- multi-arch container images to the GitHub Container Registry ------
  images:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true                  # same reason as the binaries job
      - uses: docker/setup-qemu-action@v3   # emulate arm64 for the build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: v
        run: |
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Base image (ghcr.io/mvx-lang/mvx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          build-args: LLVM_VERSION=${{ env.LLVM_VERSION }}
          # the install's release listing uses the rate-limited GitHub API
          # (mvx#212); a secret, so it never lands in an image layer
          secrets: |
            github_token=${{ secrets.GITHUB_TOKEN }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mvx-lang/mvx:${{ steps.v.outputs.tag }}
            ghcr.io/mvx-lang/mvx:latest

      - name: Daemon image (ghcr.io/mvx-lang/mvx-lmdbd)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lmdbd
          build-args: BASE=ghcr.io/mvx-lang/mvx:${{ steps.v.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mvx-lang/mvx-lmdbd:${{ steps.v.outputs.tag }}
            ghcr.io/mvx-lang/mvx-lmdbd:latest

      - name: Demo image (ghcr.io/mvx-lang/mvx-demo)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.demo
          build-args: BASE=ghcr.io/mvx-lang/mvx:${{ steps.v.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mvx-lang/mvx-demo:${{ steps.v.outputs.tag }}
            ghcr.io/mvx-lang/mvx-demo:latest

  # ---- what kind of release is this? ------------------------------------
  # Every publish step above can CREATE the release, and an unset prerelease
  # field defaults to "full release" -- so whichever ran first decided, and a
  # dev build promoted to Latest is what anyone installing by name would get.
  # Say it once, at the end, when there is nothing left to race with.
  mark:
    needs: [verify, images]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Stable is the one that is NOT a pre-release: dev, beta and rc all
          # are, and a stable tag is anything with no suffix -- v2.1.0, not
          # v2.1.0-rc1 and not dev.  Both directions are set explicitly, because
          # leaving the stable case alone means it keeps whatever the first
          # publish step happened to decide.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
