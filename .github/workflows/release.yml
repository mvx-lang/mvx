# Release pipeline: on a v* tag, build Linux binaries for amd64 and arm64
# and publish the three container images to the GitHub Container Registry
# (ghcr.io/mvx-lang/...).  No external secrets — the built-in GITHUB_TOKEN
# authenticates to ghcr.io.
name: release

on:
  push:
    # ONE rolling dev tag, moved to develop's HEAD by the nightly when there is
    # something new and CI is green.  It builds through THIS workflow rather
    # than a second copy of it, so a dev build is the same artifacts by the same
    # steps as a release -- the only way a dev build is worth having.
    tags: ["v*", "dev"]
  workflow_dispatch:
    inputs:
      tag:
        description: "version tag, e.g. v0.1.0"
        required: true

permissions:
  contents: write        # create the GitHub release and upload assets
  packages: write        # push images to ghcr.io

env:
  LLVM_VERSION: "21"

jobs:
  # ---- nothing is published from a commit CI has not passed on -----------
  # A release is a promise that this build works.  Without this the promise is
  # that it compiled on the machine that tagged it.
  ci-gate:
    name: CI must be green for this commit
    runs-on: ubuntu-latest
    timeout-minutes: 70
    steps:
      - name: Require a green ci run for this commit
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          SHA: ${{ github.sha }}
        run: |
          set -euo pipefail
          now() { date +%s; }
          api="repos/$REPO/actions/workflows/ci.yml/runs?head_sha=$SHA&per_page=100"
          appear_by=$(( $(now) + 600 ))    # 10 min for the run to show up
          finish_by=$(( $(now) + 3600 ))   # 60 min for it to finish

          while :; do
            run="$(gh api "$api" --jq '.workflow_runs | sort_by(.run_started_at) | last // empty')"

            if [ -z "$run" ]; then
              if [ "$(now)" -ge "$appear_by" ]; then
                echo "::error::no ci run for $SHA. Release only a commit CI has run on: push it, let ci finish, then tag it."
                exit 1
              fi
              echo "no ci run for $SHA yet, waiting ..."; sleep 20; continue
            fi

            id="$(printf '%s' "$run" | jq -r .id)"
            url="$(printf '%s' "$run" | jq -r .html_url)"
            status="$(printf '%s' "$run" | jq -r .status)"

            if [ "$status" != completed ]; then
              if [ "$(now)" -ge "$finish_by" ]; then
                echo "::error::ci run $url is still '$status' after 60 minutes. Not releasing on an unfinished run."
                exit 1
              fi
              echo "ci run is '$status' ($url), waiting ..."; sleep 20; continue
            fi

            concl="$(printf '%s' "$run" | jq -r .conclusion)"
            if [ "$concl" != success ]; then
              echo "::error::ci concluded '$concl' for $SHA ($url). Nothing will be published."
              exit 1
            fi

            # A run whose job was renamed, removed or never scheduled still
            # concludes 'success' overall.  A job that did not run is not a job
            # that passed.
            jobs="$(gh api "repos/$REPO/actions/runs/$id/jobs?per_page=100" \
                      --jq '[.jobs[] | select(.conclusion == "success") | .name]')"
            printf '%s' "$jobs" | jq -e 'index("build-test")' >/dev/null || {
              echo "::error::ci run $url has no successful 'build-test' job."
              exit 1
            }

            echo "ci is green for $SHA: $url"
            break
          done

  # ---- native Linux binaries, one job per architecture -------------------
  binaries:
    needs: ci-gate
    strategy:
      fail-fast: false
      matrix:
        include:
          - runner: ubuntu-latest
            arch: amd64
          - runner: ubuntu-24.04-arm
            arch: arm64
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@v5
        with:
          # THE PACKAGES ARE SUBMODULES, and the build installs them into the
          # system account — without this they check out empty and the build
          # stops at "packages/json has neither a BP source directory nor a
          # NATIVE manifest".  ci.yml has always done this; release.yml never
          # did, and got away with it until the package set grew.
          submodules: true

      - name: Install toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            cmake ninja-build gcc g++ liblmdb-dev libedit-dev \
            libgit2-dev libpq-dev pkg-config \
            zlib1g-dev libzstd-dev libncurses-dev \
            wget lsb-release software-properties-common gnupg ca-certificates
          wget -qO /tmp/llvm.sh https://apt.llvm.org/llvm.sh
          chmod +x /tmp/llvm.sh
          sudo /tmp/llvm.sh "${LLVM_VERSION}"
          sudo apt-get install -y --no-install-recommends "llvm-${LLVM_VERSION}-dev"

      - name: Build and install
        run: |
          cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release \
            -DCMAKE_PREFIX_PATH="/usr/lib/llvm-${LLVM_VERSION}"
          cmake --build build
          cmake --install build --prefix "$PWD/stage/mvx-lang"

      - name: Smoke test the install
        run: |
          BIN="$PWD/stage/mvx-lang/bin"
          printf 'PRINT "install-ok ":2+2\n' > /tmp/smoke.b
          "$BIN/mvx-basic" /tmp/smoke.b -o /tmp/smoke
          out="$(/tmp/smoke)"
          echo "$out"
          test "$out" = "install-ok 4"

      - name: Bundle the wiki docs
        run: |
          # Ship the current documentation (the GitHub wiki) inside the tarball
          # so offline installs have the docs.  Cloned fresh at release time so
          # it is always the latest wiki, independent of the docs/ submodule pin.
          git clone --depth 1 https://github.com/mvx-lang/mvx.wiki.git wiki
          rm -rf wiki/.git
          install -d stage/mvx-lang/share/doc/mvx
          cp -R wiki/. stage/mvx-lang/share/doc/mvx/

      - name: Package tarball
        id: pkg
        run: |
          VER="${GITHUB_REF_NAME#v}"
          [ "${{ github.event_name }}" = workflow_dispatch ] && VER="${{ inputs.tag }}" && VER="${VER#v}"
          NAME="mvx-lang-${VER}-linux-${{ matrix.arch }}.tar.gz"
          tar -C stage -czf "$NAME" mvx-lang
          echo "name=$NAME" >> "$GITHUB_OUTPUT"

      - name: Attach to release
        uses: softprops/action-gh-release@v3
        with:
          files: ${{ steps.pkg.outputs.name }}
          tag_name: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
          generate_release_notes: true

  # ---- multi-arch container images to the GitHub Container Registry ------
  images:
    needs: ci-gate
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          submodules: true                  # same reason as the binaries job
      - uses: docker/setup-qemu-action@v3   # emulate arm64 for the build
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Resolve version
        id: v
        run: |
          REF="${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}"
          echo "tag=${REF#v}" >> "$GITHUB_OUTPUT"

      - name: Base image (ghcr.io/mvx-lang/mvx)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.base
          build-args: LLVM_VERSION=${{ env.LLVM_VERSION }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mvx-lang/mvx:${{ steps.v.outputs.tag }}
            ghcr.io/mvx-lang/mvx:latest

      - name: Daemon image (ghcr.io/mvx-lang/mvx-lmdbd)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.lmdbd
          build-args: BASE=ghcr.io/mvx-lang/mvx:${{ steps.v.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mvx-lang/mvx-lmdbd:${{ steps.v.outputs.tag }}
            ghcr.io/mvx-lang/mvx-lmdbd:latest

      - name: Demo image (ghcr.io/mvx-lang/mvx-demo)
        uses: docker/build-push-action@v6
        with:
          context: .
          file: docker/Dockerfile.demo
          build-args: BASE=ghcr.io/mvx-lang/mvx:${{ steps.v.outputs.tag }}
          platforms: linux/amd64,linux/arm64
          push: true
          tags: |
            ghcr.io/mvx-lang/mvx-demo:${{ steps.v.outputs.tag }}
            ghcr.io/mvx-lang/mvx-demo:latest

  # ---- what kind of release is this? ------------------------------------
  # Every publish step above can CREATE the release, and an unset prerelease
  # field defaults to "full release" -- so whichever ran first decided, and a
  # dev build promoted to Latest is what anyone installing by name would get.
  # Say it once, at the end, when there is nothing left to race with.
  mark:
    needs: [binaries, images]
    runs-on: ubuntu-latest
    steps:
      - name: Say what this release is
        env:
          GH_TOKEN: ${{ github.token }}
          GH_REPO: ${{ github.repository }}
          TAG: ${{ github.event_name == 'workflow_dispatch' && inputs.tag || github.ref_name }}
        run: |
          set -euo pipefail
          # Stable is the one that is NOT a pre-release: dev, beta and rc all
          # are, and a stable tag is anything with no suffix -- v2.1.0, not
          # v2.1.0-rc1 and not dev.  Both directions are set explicitly, because
          # leaving the stable case alone means it keeps whatever the first
          # publish step happened to decide.
          case "$TAG" in
            dev|*-*) gh release edit "$TAG" --prerelease --latest=false
                     echo "$TAG is a pre-release, and not latest." ;;
            *)       gh release edit "$TAG" --prerelease=false --latest
                     echo "$TAG is a stable release, and is latest." ;;
          esac
